name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.0.5-nishisaba.1). Creates tag v<version> and a release."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Set release version
        if: github.event_name == 'workflow_dispatch'
        run: mvn -B -q versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B install

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiCheatReplay
          path: target/AntiCheatReplay-*.jar

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: target/AntiCheatReplay-*.jar
          generate_release_notes: false
